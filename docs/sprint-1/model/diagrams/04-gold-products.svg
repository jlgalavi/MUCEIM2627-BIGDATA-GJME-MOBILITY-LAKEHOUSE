<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="970" viewBox="0 0 1500 970" role="img" aria-labelledby="title desc">
<title id="title">04  Gold analytical products and dependencies</title><desc id="desc">Separate observed aggregations from estimates; preserve territorial level and analysis window</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#657892"/></marker></defs>
<rect width="1500" height="970" fill="#f7f9fc"/>
<text x="42" y="46" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#172b46">04  Gold analytical products and dependencies</text>
<text x="42" y="77" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#52647b">Separate observed aggregations from estimates; preserve territorial level and analysis window</text>
<text x="42" y="135" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#8a690c">A  HOURLY MOBILITY PROFILES</text>
<rect x="42" y="163" width="312" height="174" rx="12" fill="white" stroke="#8a690c" stroke-width="1.5"/>
<path d="M56 164 H340" stroke="#8a690c" stroke-width="4"/>
<text x="60" y="197" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#8a690c">Segmented OD trips</text>
<text x="60" y="229" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#52647b">Typed measures + quality flags</text>
<text x="60" y="256" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#52647b">Original day, hour and segments</text>
<text x="60" y="283" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#52647b">One territorial product at a time</text>
<polyline points="354,248 406,248" fill="none" stroke="#657892" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="414" y="163" width="312" height="174" rx="12" fill="white" stroke="#8a690c" stroke-width="1.5"/>
<path d="M428 164 H712" stroke="#8a690c" stroke-width="4"/>
<text x="432" y="197" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#8a690c">daily_od_hourly</text>
<text x="432" y="229" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#52647b">SUM segments per day / hour</text>
<text x="432" y="256" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#52647b">Retain origin and destination</text>
<text x="432" y="283" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#52647b">Reconcile trips with Silver</text>
<polyline points="726,248 778,248" fill="none" stroke="#657892" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="786" y="163" width="312" height="174" rx="12" fill="white" stroke="#8a690c" stroke-width="1.5"/>
<path d="M800 164 H1084" stroke="#8a690c" stroke-width="4"/>
<text x="804" y="197" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#8a690c">Typical OD profile</text>
<text x="804" y="229" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#52647b">Average comparable daily totals</text>
<text x="804" y="256" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#52647b">Count valid contributing days</text>
<text x="804" y="283" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#52647b">Retain OD and sample window</text>
<rect x="1158" y="163" width="300" height="174" rx="12" fill="white" stroke="#8a690c" stroke-width="1.5"/>
<path d="M1172 164 H1444" stroke="#8a690c" stroke-width="4"/>
<text x="1176" y="197" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#8a690c">Zone hourly profile</text>
<text x="1176" y="229" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#52647b">Daily departures / arrivals</text>
<text x="1176" y="256" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#52647b">Average valid comparable days</text>
<text x="1176" y="283" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#52647b">24-hour features; clustering later</text>
<polyline points="570,337 570,350 1308,350 1308,337" fill="none" stroke="#657892" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="42" y="365" width="1416" height="75" rx="12" fill="#fbf6e7" stroke="#e2d3a3" stroke-width="1.5"/>
<text x="64" y="395" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#8a690c">AVERAGE CONTRACT</text>
<text x="64" y="423" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#172b46">Sum each day first. Define valid-day coverage; missing or censored observations are not automatically zero.</text>
<text x="42" y="498" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#8a690c">B  GRAVITY INPUTS AND ESTIMATES</text>
<rect x="42" y="527" width="312" height="174" rx="12" fill="white" stroke="#8a690c" stroke-width="1.5" stroke-dasharray="7 5"/>
<path d="M56 528 H340" stroke="#8a690c" stroke-width="4"/>
<text x="60" y="561" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#8a690c">Aligned input sources</text>
<text x="60" y="593" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#52647b">OD totals for one analysis window</text>
<text x="60" y="620" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#52647b">Population + economic indicator</text>
<text x="60" y="647" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#52647b">Zone-pair spatial distance</text>
<polyline points="354,611 406,611" fill="none" stroke="#657892" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="414" y="527" width="312" height="174" rx="12" fill="white" stroke="#8a690c" stroke-width="1.5" stroke-dasharray="7 5"/>
<path d="M428 528 H712" stroke="#8a690c" stroke-width="4"/>
<text x="432" y="561" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#8a690c">gravity_inputs</text>
<text x="432" y="593" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#52647b">Validated geography mappings</text>
<text x="432" y="620" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#52647b">Reference periods and units</text>
<text x="432" y="647" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#52647b">Missing-data / coverage flags</text>
<polyline points="726,611 778,611" fill="none" stroke="#657892" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="786" y="527" width="312" height="174" rx="12" fill="white" stroke="#8a690c" stroke-width="1.5" stroke-dasharray="7 5"/>
<path d="M800 528 H1084" stroke="#8a690c" stroke-width="4"/>
<text x="804" y="561" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#8a690c">Calibration run</text>
<text x="804" y="593" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#52647b">k, economic proxy and window</text>
<text x="804" y="620" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#52647b">Zero and intra-zone distance rules</text>
<text x="804" y="647" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#52647b">Record parameters + run ID</text>
<polyline points="1098,611 1150,611" fill="none" stroke="#657892" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="1158" y="527" width="300" height="174" rx="12" fill="white" stroke="#8a690c" stroke-width="1.5" stroke-dasharray="7 5"/>
<path d="M1172 528 H1444" stroke="#8a690c" stroke-width="4"/>
<text x="1176" y="561" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#8a690c">gravity_estimates</text>
<text x="1176" y="593" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#52647b">Estimated vs observed demand</text>
<text x="1176" y="620" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#52647b">Ratio and coverage flags</text>
<text x="1176" y="647" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#52647b">Interpretation needs validation</text>
<rect x="42" y="736" width="1416" height="100" rx="12" fill="white" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="64" y="773" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" fill="#172b46">estimated trips = k × population(origin) × economic proxy(destination) / distance_km²</text>
<text x="64" y="808" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#52647b">mismatch = estimated / observed trips, with an explicit policy for zero or missing observations</text>
<text x="42" y="890" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#52647b">Pending: geometries, source-to-zone aliases, INE alignment and model calibration. No infrastructure ranking is reported.</text>
<text x="42" y="927" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#52647b">The original third business question is still to be selected; its mart will follow a separate reviewed contract.</text>
</svg>